[package]
name = "monitor"
version = "0.3.0"
edition = "2021"
rust-version = "1.75"
description = "Null-dependency Windows resource monitor: CPU, memory, disk, network, GPU, processes, thermals, fan, battery"
license = "MIT"
publish = false
default-run = "monitor"

[features]
default = []
# The egui shell. Off by default so `cargo build --release` stays dependency-free.
gui = ["dep:eframe", "dep:egui-winit"]

[[bin]]
name = "monitor"
path = "src/main.rs"

[[bin]]
name = "monitor-gui"
path = "src/gui_main.rs"
required-features = ["gui"]

# The TUI build has zero dependencies on purpose: every reading comes from a
# documented Win32 / PDH / NT syscall, so startup is instant, the binary stays
# small and no third-party code runs inside a process that sits in the
# background all day. `eframe` is optional and only compiled for the GUI shell.
[dependencies]
eframe = { version = "0.37", optional = true, default-features = false, features = ["glow", "default_fonts"] }
# Named directly so the throttle can read `egui_winit::MOVE_REPAINT_DELAY_MS`
# from the patched copy below; it is already in the graph via eframe.
egui-winit = { version = "0.37", optional = true, default-features = false }

# monitor patch: stop mouse motion from repainting at the input rate.
# See vendor/egui-winit/VENDORED.md and docs/高帧率重绘问题.md.
[patch.crates-io]
egui-winit = { path = "vendor/egui-winit" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = false
debug = false

[profile.dev]
opt-level = 1
